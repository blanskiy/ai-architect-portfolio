apiVersion: apps/v1
kind: Deployment
metadata:
  name: resnet-api
  labels:
    app: resnet-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resnet-api
  template:
    metadata:
      labels:
        app: resnet-api
    spec:
      containers:
      - name: resnet-api
        image: resnet-serving:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30