# Prometheus Alert Rules for Model Monitoring
# Place this file in your Prometheus rules directory

groups:
  - name: model_performance
    interval: 30s
    rules:
      # High Latency Alert
      - alert: ModelHighLatency
        expr: histogram_quantile(0.95, sum(rate(model_prediction_latency_seconds_bucket[5m])) by (le, model_name)) > 0.1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High model latency detected"
          description: "Model {{ $labels.model_name }} P95 latency is {{ $value | humanizeDuration }} (threshold: 100ms)"
          runbook_url: "https://wiki.company.com/runbooks/model-high-latency"

      # Critical Latency Alert
      - alert: ModelCriticalLatency
        expr: histogram_quantile(0.95, sum(rate(model_prediction_latency_seconds_bucket[5m])) by (le, model_name)) > 0.5
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Critical model latency"
          description: "Model {{ $labels.model_name }} P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"
          runbook_url: "https://wiki.company.com/runbooks/model-critical-latency"

      # High Error Rate
      - alert: ModelHighErrorRate
        expr: |
          sum(rate(model_prediction_errors_total[5m])) by (model_name)
          / sum(rate(model_predictions_total[5m])) by (model_name)
          > 0.01
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Model error rate elevated"
          description: "Model {{ $labels.model_name }} error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      # Critical Error Rate
      - alert: ModelCriticalErrorRate
        expr: |
          sum(rate(model_prediction_errors_total[5m])) by (model_name)
          / sum(rate(model_predictions_total[5m])) by (model_name)
          > 0.05
        for: 2m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "Model error rate critical"
          description: "Model {{ $labels.model_name }} error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Low Throughput (potential outage)
      - alert: ModelLowThroughput
        expr: sum(rate(model_predictions_total[5m])) by (model_name) < 1
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Model throughput very low"
          description: "Model {{ $labels.model_name }} is receiving less than 1 req/s for 10 minutes"

      # No Traffic (outage)
      - alert: ModelNoTraffic
        expr: sum(rate(model_predictions_total[5m])) by (model_name) == 0
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Model receiving no traffic"
          description: "Model {{ $labels.model_name }} has received no requests for 5 minutes"

  - name: model_drift
    interval: 1m
    rules:
      # Data Drift Warning
      - alert: DataDriftWarning
        expr: model_data_drift_score > 0.1
        for: 15m
        labels:
          severity: warning
          category: drift
        annotations:
          summary: "Data drift detected"
          description: "Model {{ $labels.model_name }} data drift score is {{ $value }} (threshold: 0.1)"
          runbook_url: "https://wiki.company.com/runbooks/data-drift"

      # Data Drift Critical
      - alert: DataDriftCritical
        expr: model_data_drift_score > 0.2
        for: 5m
        labels:
          severity: critical
          category: drift
        annotations:
          summary: "Significant data drift detected"
          description: "Model {{ $labels.model_name }} data drift score is {{ $value }} (threshold: 0.2). Consider retraining."

      # Prediction Drift Warning
      - alert: PredictionDriftWarning
        expr: model_prediction_drift_score > 0.15
        for: 15m
        labels:
          severity: warning
          category: drift
        annotations:
          summary: "Prediction drift detected"
          description: "Model {{ $labels.model_name }} prediction distribution has shifted. Score: {{ $value }}"

      # Feature Drift (per feature)
      - alert: FeatureDrift
        expr: model_feature_drift_score > 0.2
        for: 30m
        labels:
          severity: warning
          category: drift
        annotations:
          summary: "Feature drift detected"
          description: "Feature {{ $labels.feature_name }} in model {{ $labels.model_name }} has drifted. Score: {{ $value }}"

  - name: model_health
    interval: 1m
    rules:
      # Model endpoint down
      - alert: ModelEndpointDown
        expr: up{job="model-endpoint"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Model endpoint is down"
          description: "Model endpoint {{ $labels.instance }} is not responding"

      # Prediction class imbalance (sudden shift)
      - alert: PredictionClassImbalance
        expr: |
          abs(
            sum(rate(model_prediction_class_total{predicted_class="1"}[1h])) 
            / sum(rate(model_prediction_class_total[1h]))
            - 0.5
          ) > 0.3
        for: 30m
        labels:
          severity: warning
          category: drift
        annotations:
          summary: "Prediction class distribution imbalanced"
          description: "Model predictions are heavily skewed. This may indicate data or model issues."

