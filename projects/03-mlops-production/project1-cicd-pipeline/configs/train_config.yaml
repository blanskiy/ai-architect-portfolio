# Training Configuration
# Used by train.py

# Data
data_path: "data/train.csv"
data_version: "v1.0"
test_size: 0.2
random_seed: 42

# Model
model_type: "random_forest"  # Options: random_forest, gradient_boosting, logistic_regression

model_params:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 5
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1

# Alternative: Gradient Boosting
# model_type: "gradient_boosting"
# model_params:
#   n_estimators: 100
#   max_depth: 5
#   learning_rate: 0.1
#   random_state: 42

# MLflow
experiment_name: "stihl-sales-model"
