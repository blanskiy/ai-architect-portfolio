# Secret for sensitive configuration
# In production, use Azure Key Vault, AWS Secrets Manager, or Sealed Secrets

apiVersion: v1
kind: Secret
metadata:
  name: ml-model-secrets
  namespace: ml-production
  labels:
    app.kubernetes.io/name: ml-model
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Model Registry credentials (if downloading from registry)
  MLFLOW_TRACKING_URI: "https://mlflow.example.com"
  MLFLOW_TRACKING_USERNAME: "ml-service"
  MLFLOW_TRACKING_PASSWORD: "change-me-in-production"
  
  # Azure Storage (if loading models from blob storage)
  AZURE_STORAGE_CONNECTION_STRING: ""
  
  # API Keys for downstream services
  API_KEY: "your-api-key-here"

---
