# Ingress for external access
# Routes external traffic to the ML model service

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-model-ingress
  namespace: ml-production
  labels:
    app.kubernetes.io/name: ml-model
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller annotations
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # CORS (if needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    
    # TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Azure Application Gateway annotations (if using AGIC)
    # appgw.ingress.kubernetes.io/backend-path-prefix: "/"
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # TLS configuration
  tls:
  - hosts:
    - ml-api.example.com
    secretName: ml-model-tls
  
  # Routing rules
  rules:
  - host: ml-api.example.com
    http:
      paths:
      # Main API endpoint
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ml-model
            port:
              number: 80
      
      # Version-specific path
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: ml-model
            port:
              number: 80

---
# IngressClass (if not using default)
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
