# Staging environment values
# Override default values for staging deployment

image:
  tag: "staging"

replicaCount: 2

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

config:
  LOG_LEVEL: "DEBUG"
  MODEL_NAME: "model-staging.joblib"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: ml-api-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ml-model-staging-tls
      hosts:
        - ml-api-staging.example.com

# Use smaller storage for staging
volumes:
  modelStorage:
    size: 5Gi
    storageClass: managed-standard
